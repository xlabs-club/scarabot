name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@26
          cache: true
          install: false

      - run: pnpm ci
      - run: pnpm lint
